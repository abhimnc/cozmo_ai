[project]
name = "cozmo"
version = "0.1.0"
description = "Handheld capture to dimensioned floor plan, damage regions and repair scope."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
]

[project.scripts]
cozmo = "cozmo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/cozmo"]
